name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: build & test (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: gcc
            cxx: g++
          - cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ${{ matrix.cc }}

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DLOB_BUILD_PYTHON=OFF

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang

      - name: Configure (sanitizers)
        env:
          CC: clang
          CXX: clang++
        run: >
          cmake -S . -B build-asan -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DLOB_SANITIZE=ON
          -DLOB_BUILD_PYTHON=OFF
          -DLOB_BUILD_BENCH=OFF

      - name: Build
        run: cmake --build build-asan -j

      - name: Test under sanitizers
        run: ctest --test-dir build-asan --output-on-failure

  python:
    name: python bindings + analytics smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Build lobpy
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DLOB_BUILD_TESTS=OFF -DLOB_BUILD_BENCH=OFF
          cmake --build build -j

      - name: Smoke test analytics
        run: |
          export PYTHONPATH=$PWD/build
          python -c "import lobpy; s=lobpy.simulate(n=20000, seed=3); print('trades', len(s['trades']['price']))"
          python analytics/run_analytics.py 20000 3
